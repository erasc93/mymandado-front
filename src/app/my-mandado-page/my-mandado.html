<p-toolbar>
   <p-button (onClick)="sidebarVisible=true" 
   icon="pi pi-cart-plus" severity="contrast"/>

   @if(currentChild()!='products'){
      <p-button  label="Produits"  severity="contrast" routerLink="products" />
   }@else{
      <p-button  icon="pi pi-home" label="" severity="info" severity="contrast" routerLink="todos" />
   }
   <p-button icon="pi pi-sign-out" (click)="logout()" severity="contrast" label="bye"/>
</p-toolbar>
<router-outlet/>

<div class="card flex justify-left">
   <p-drawer [(visible)]="sidebarVisible" 
   header="Mes listes">

   <div class="cart-actions">
      <div class="cart-actions__left">
         <p-button icon="pi pi-share-alt" (onClick)="openShare()" severity="info"/>
         <p-button icon="pi pi-list" (onClick)="toggleTemplates()" severity="secondary"/>
      </div>
      <div class="cart-actions__right">
         <p-button icon="pi pi-trash" (onClick)="removeCart()" severity="danger"/>
      </div>
   </div>

   <div class="cart-name">
      <input pInputText type="text" placeholder="Nom du cart" [(ngModel)]="newCartName" />
      <p-button icon="pi pi-plus" label="Ajouter" (onClick)="addCart()" />
   </div>

   <div class="cart-rename">
      <input pInputText type="text" placeholder="Renommer cart" [(ngModel)]="renameCartName" />
      <p-button icon="pi pi-pencil" label="Renommer" (onClick)="renameCart()" [disabled]="!_state.selectedCart()" />
   </div>

   @if (shareVisible()) {
      <div class="cart-share">
         <input pInputText type="text" placeholder="Utilisateur" [(ngModel)]="shareUsername" />
         <div class="cart-share__actions">
            <p-button label="Partager" (onClick)="submitShare()" />
            <p-button label="Annuler" severity="secondary" (onClick)="cancelShare()" />
         </div>
      </div>
   }

   @if (templateVisible()) {
      <div class="cart-templates">
         <div class="cart-templates__title">Templates</div>
         <div class="cart-templates__list">
            @for (template of cartTemplates; track template.name) {
               <p-button label="{{template.name}}" (onClick)="createFromTemplate(template)" />
            }
         </div>
      </div>
   }

   <p-listbox 
   [(ngModel)]="_state.selectedCart" 
   [options]="_state._carts()" 
   (onChange)="selectCart($event.value)"
   optionLabel="name" 
   [checkmark]="false" 
   [highlightOnSelect]="true" 
   class="w-full md:w-55"
   />
   </p-drawer>
</div>
