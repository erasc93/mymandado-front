<p-toolbar>
   <p-button (onClick)="sidebarVisible=true" 
   icon="pi pi-cart-plus" severity="contrast"/>
   
   @if(currentChild()!='products'){
      <p-button  label="Produits"  severity="contrast" routerLink="products" />
   }@else{
      <p-button  icon="pi pi-home" label="" severity="info" severity="contrast" routerLink="todos" />
   }
   <p-button icon="pi pi-sign-out" (click)="logout()" severity="contrast" label="bye"/>
</p-toolbar>
<router-outlet/>

<div class="card flex justify-left">
   <p-drawer [(visible)]="sidebarVisible" 
   header="Mes listes">
   
   @if (cartEditVisible()) {
      <form class="cart-rename-form" #cartRenameForm="ngForm" (ngSubmit)="submitCartEdit(cartEditForm())">
         <div class="cart-rename-form__row">
            <label class="cart-rename-form__label" for="cart-rename-name">Nom du cart</label>
            <input
            id="cart-rename-name"
            name="name"
            type="text"
            pInputText
            required
            [(ngModel)]="cartEditForm().name"
            />
         </div>
         <div class="cart-rename-form__actions">
            <p-button label="Annuler" severity="secondary" (onClick)="cancelCartEdit()" />
            <p-button type="submit" label="Enregistrer" severity="success" />
         </div>
      </form>
   }
   
   @if (!cartEditVisible()) {
      <div class="cart-actions">
         <div class="cart-actions__left">
            <p-button icon="pi pi-share-alt" (onClick)="openShare()" severity="info"/>
         </div>
         <div class="cart-actions__right">
            <p-button icon="pi pi-trash" (onClick)="removeCart()" severity="danger"/>
         </div>
      </div>
      
      @if (shareVisible()) {
         <div class="cart-share">
            <input pInputText type="text" placeholder="Utilisateur" [(ngModel)]="shareUsername" />
            <div class="cart-share__actions">
               <p-button label="Partager" (onClick)="submitShare()" />
               <p-button label="Annuler" severity="secondary" (onClick)="cancelShare()" />
            </div>
         </div>
      }
      
      <div class="cart-list">
         @for (cart of _state._carts(); track cart.id) {
            <div class="cart-row" [class.cart-row--active]="_state.selectedCart()?.id === cart.id">
               <button type="button" class="cart-row__label" (click)="selectCart(cart)">
                  <span class="cart-row__name">{{ cart.name }}</span>
               </button>
               <div class="cart-row__actions">
                  <p-menu #menu [model]="cartMenuItems(cart)" [popup]="true" />
                  <p-button icon="pi pi-ellipsis-v" (onClick)="menu.toggle($event)" severity="secondary" size="small" />
               </div>
            </div>
         }
      </div>
      
      <div class="cart-name">
         <input pInputText type="text" placeholder="Nouveau cart" [(ngModel)]="newCartName" />
         <p-button icon="pi pi-plus"  (onClick)="addCart()" />
      </div>
   }
</p-drawer>

</div>
